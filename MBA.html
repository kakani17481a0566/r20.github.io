<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Under Construction</title>
    <!-- Bootstrap 5 CDN link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        /* Custom CSS for the page */
        body {
            font-family: Arial, sans-serif;
            background-color:black;
            padding: 0;
            margin: 0;
        }

        /* Style for the navigation bar */
        .navbar {
            background-color: #343a40;
            padding: 1rem;
        }

        .navbar .btn {
            background-color: #007bff;
            color: white;
            border: none;
            font-size: 1.1rem;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .navbar .btn:hover {
            background-color: #0056b3;
        }

        /* Card styling for the under construction message */
        .card {
            margin-top: 100px;
            background-color:black;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }

        .card-body {
            text-align: center;
        }

        .card-body h1 {
            font-size: 3rem;
            font-weight: bold;
            color: #ff5733;
        }

        .card-body p {
            font-size: 1.25rem;
            color: #555555;
            margin-bottom: 2rem;
        }

        /* Styling for the spinner */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        /* Animation for the spinner */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Additional padding and margin for buttons in the navbar */
        .navbar .d-flex {
            justify-content: center;
            gap: 15px;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark p-3">
        <div class="container-fluid d-flex flex-column align-items-center">
            <div class="d-flex gap-4">
                <button onclick="location.href='index.html'" id="btn-Home" class="btn">Home</button>
                <button onclick="location.href='R20.html'" id="btn-r20" class="btn">R20</button>
                <button onclick="location.href='R23.html'" id="btn-r23" class="btn">R23</button>
                <button onclick="location.href='MBA.html'" id="btn-MBA" class="btn">MBA</button>
             
            </div>
        </div>
    </nav>

    <!-- Bootstrap Card for Page Under Construction Message -->
    <div class="container">
        <div class="card">
            <div class="card-body">
                <h1>Page Under Construction</h1>
                <p>We're working hard to bring you this page. Please check back later.</p>
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js CDN links -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

</body>

</html>
