<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Under Construction</title>
    <!-- Bootstrap 5 CDN link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            background-color: #000000;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            padding: 30px;
            background-color: black;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 60%;
            margin-top: 100px;
        }

        h1 {
            color: #f39c12;
            font-size: 48px;
        }

        p {
            color: #7f8c8d;
            font-size: 20px;
        }

        .spinner {
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card {
            background-color: #1e1e1e;
            border: none;
            border-radius: 15px;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .card-body {
            text-align: center;
            padding: 50px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark p-3">
        <div class="container-fluid d-flex flex-column align-items-center">
            <div class="d-flex gap-4">
                <button onclick="location.href='index.html'" id="btn-Home" class="btn custom-btn">Home</button>
                <button onclick="location.href='R20.html'" id="btn-r20" class="btn custom-btn">R20</button>
                <button onclick="location.href='R23.html'" id="btn-r23" class="btn custom-btn">R23</button>
                <button onclick="location.href='MBA.html'" id="btn-MBA" class="btn custom-btn">MBA</button> <!-- Updated link for MBA -->
                <button onclick="location.href='MBA.html'" id="btn-MBA" class="btn custom-btn">MBA</button>
            </div>
        </div>
    </nav>

    <!-- Bootstrap Card for Page Under Construction Message -->
    <div class="container">
        <div class="card">
            <div class="card-body">
                <h1>Page Under Construction</h1>
                <p>We're working hard to bring you this page. Please check back later.</p>
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js CDN links -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

</body>
</html>
